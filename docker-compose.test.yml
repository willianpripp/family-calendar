# The test stack: a throwaway Postgres plus a plain Python container running
# pytest, so the DB-backed bot_tick routing tests (tests/test_bot_tick_meds.py)
# have somewhere real to run. tests/test_meds_forward.py needs none of this —
# forward_meds_callback is pure — but pytest collects the whole tests/
# directory in one process either way.
#
# Run with a distinct project name so it can never collide with the real
# `family-calendar` deployment on the same docker host:
#   docker compose -f docker-compose.test.yml -p calendar-test run --rm tests
# Then always clean up:
#   docker compose -f docker-compose.test.yml -p calendar-test down -v --remove-orphans

services:

  db:
    image: postgres:17.10
    environment:
      POSTGRES_DB: calendar_test
      POSTGRES_USER: calendar_test
      POSTGRES_PASSWORD: calendar_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calendar_test -d calendar_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  tests:
    image: python:3.13-slim
    depends_on:
      db:
        condition: service_healthy
    # main.py mounts StaticFiles(directory="static") — a path relative to
    # the process's OWN cwd, exactly as production's Dockerfile (WORKDIR
    # /app, then `uvicorn main:app`) runs it. Importing main.py at all
    # requires that same cwd, or FastAPI fails at import time looking for
    # a "static" directory that isn't wherever pytest happened to start.
    working_dir: /work/app
    volumes:
      - ./:/work
    environment:
      DATABASE_URL: postgresql://calendar_test:calendar_test@db:5432/calendar_test
      CAL_TZ: America/New_York
      PYTHONPATH: /work/app
    command: >
      bash -c "
        pip install --no-cache-dir -r requirements.txt -r ../tests/requirements.txt &&
        pytest -q ../tests
      "
