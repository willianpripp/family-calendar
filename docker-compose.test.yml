# The test stack: a throwaway Postgres plus a Python container running
# pytest, so the suite runs with one command and nothing installed on the
# host. Always with a distinct project name, so it can never touch the real
# `calendar` deployment on the same docker host:
#   docker compose -f docker-compose.test.yml -p calendar-test run --rm tests
#   docker compose -f docker-compose.test.yml -p calendar-test down -v --remove-orphans

services:

  db:
    image: postgres:17.10
    environment:
      POSTGRES_DB: calendar_test
      POSTGRES_USER: calendar_test
      POSTGRES_PASSWORD: calendar_test
    # tmpfs: this database exists for one run only.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calendar_test -d calendar_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  tests:
    image: python:3.13-slim
    depends_on:
      db:
        condition: service_healthy
    working_dir: /work
    volumes:
      - ./:/work
    environment:
      DATABASE_URL: postgresql://calendar_test:calendar_test@db:5432/calendar_test
      CAL_TZ: America/New_York
      CAL_API_KEY: test-api-key
      PYTHONDONTWRITEBYTECODE: "1"
    command: >
      bash -c "
        pip install --no-cache-dir -q -r app/requirements.txt -r tests/requirements.txt &&
        pytest -q -p no:cacheprovider
      "
